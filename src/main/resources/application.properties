# ============================================
# BOZACM - PROJET INTÉGRÉ
# Modules: Réservations (Youyou) + Agences (Naomie)
# ============================================

# ============================================
# CONFIGURATION H2 (BASE DE DONNÉES PERSISTANTE EN FICHIER)
# ============================================
spring.datasource.url=jdbc:h2:file:./data/bozacm_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dialecte Hibernate pour H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Console H2 (pour voir la base de données)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================
# CONFIGURATION JPA / HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging SQL
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================================
# CONFIGURATION SERVEUR
# ============================================
server.port=8080

# ============================================
# CONFIGURATION SWAGGER / OPENAPI
# ============================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true

# ============================================
# CONFIGURATION QR CODE
# ============================================
app.qrcode.upload-dir=uploads/qrcodes
app.qrcode.base-url=http://172.20.10.7:8080/qrcodes
server.address=0.0.0.0

# ============================================
# CONFIGURATION EMAIL - NOUVEAU !
# ============================================

# Serveur SMTP Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=youyoustyve@gmail.com
spring.mail.password=yhzfgamnbjlquldx

# Propriétés SMTP
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Timeout (optionnel mais recommandé)
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Informations de l'application
app.name=BozaCM
app.support.email=support@bozacm.cm
app.frontend.url=http://192.168.100.222:4200

# ============================================
# INFOS APPLICATION
# ============================================
spring.application.name=BOZACM - Projet Intégré (Réservations + Agences + Email)

