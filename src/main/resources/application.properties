# ============================================
# CONFIGURATION H2 (BASE DE DONNÉES EN MÉMOIRE)
# ============================================
# Pour évaluation - Base de données temporaire
# Toutes les données sont en RAM (rapide mais non persistantes)
# ============================================

# ============================================
# CONFIGURATION QR CODE
# ============================================

# Dossier de stockage des QR Codes
app.qrcode.upload-dir=uploads/qrcodes

# URL de base pour accéder aux QR Codes
app.qrcode.base-url=http://localhost:8080/qrcodes

# ============================================

# URL de connexion H2 (en mémoire)
spring.datasource.url=jdbc:h2:mem:bozacm_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dialecte Hibernate pour H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Console H2 (pour voir la base de données)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================
# CONFIGURATION JPA / HIBERNATE
# ============================================

# Recréer les tables à chaque démarrage (pour démo)
spring.jpa.hibernate.ddl-auto=create-drop

# Afficher les requêtes SQL dans la console (utile pour débugger)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging SQL
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================================
# CONFIGURATION SERVEUR
# ============================================

# Port de l'application
server.port=8080

# Context path (optionnel)
# server.servlet.context-path=/api

# ============================================
# CONFIGURATION SWAGGER / OPENAPI
# ============================================

# Swagger UI accessible à : http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Activer Swagger
springdoc.swagger-ui.enabled=true

# ============================================
# INFOS APPLICATION
# ============================================

spring.application.name=BOZACM - Gestion de Voyages

# ============================================
# CONFIGURATION MYSQL (Désactivée temporairement)
# ============================================
# Décommenter ces lignes pour utiliser MySQL en production
#
# spring.datasource.url=jdbc:mysql://localhost:3306/bozacm_db
# spring.datasource.username=root
# spring.datasource.password=
