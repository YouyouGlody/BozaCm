# ============================================
# BOZACM - PROJET INTÉGRÉ
# ============================================

spring.application.name=bozacm

# ============================================
# CONFIGURATION MySQL (local)
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/bozacm_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# ============================================
# JPA / HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs SQL
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================================
# SERVEUR
# ============================================
server.port=8080
server.address=0.0.0.0

# ============================================
# SWAGGER / OPENAPI
# ============================================
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# ============================================
# EMAIL (Gmail SMTP)
# ============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=youyoustyve@gmail.com
spring.mail.password=yhzfgamnbjlquldx
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ============================================
# QR CODE
# ============================================
app.qrcode.upload-dir=uploads/qrcodes
app.qrcode.base-url=http://localhost:8080/qrcodes

# ============================================
# INFOS APPLICATION
# ============================================
app.name=BozaCM
app.support.email=support@bozacm.cm
app.frontend.url=http://localhost:4200

