# ============================================
# BOZACM - PROJET INTÉGRÉ
# Modules: Réservations (Youyou) + Agences (Naomie)
# ============================================

# ============================================
# CONFIGURATION H2 (BASE DE DONNÉES EN MÉMOIRE)
# ============================================
spring.datasource.url=jdbc:h2:mem:bozacm_integrated_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dialecte Hibernate pour H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Console H2 (pour voir la base de données)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================
# CONFIGURATION JPA / HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging SQL
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================================
# CONFIGURATION SERVEUR
# ============================================
server.port=8080

# ============================================
# CONFIGURATION SWAGGER / OPENAPI
# ============================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true

# ============================================
# CONFIGURATION QR CODE
# ============================================
app.qrcode.upload-dir=uploads/qrcodes
app.qrcode.base-url=http://localhost:8080/qrcodes

# ============================================
# INFOS APPLICATION
# ============================================
spring.application.name=BOZACM - Projet Intégré (Réservations + Agences)

# ============================================
# NOTES
# ============================================
# Console H2: http://localhost:8080/h2-console
#   - JDBC URL: jdbc:h2:mem:bozacm_integrated_db
#   - Username: sa
#   - Password: (vide)
#
# Swagger UI: http://localhost:8080/swagger-ui.html
# API Docs: http://localhost:8080/api-docs
#
# Les données sont en mémoire et seront perdues à l'arrêt
# ============================================
