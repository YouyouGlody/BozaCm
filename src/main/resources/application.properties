# ============================================

# ============================================
# NOTES IMPORTANTES
# ============================================
# 1. H2 Console accessible à : http://localhost:8080/h2-console
#    - JDBC URL : jdbc:h2:mem:bozacm_db
#    - Username : sa
#    - Password : (vide)
#
# 2. Swagger UI accessible à : http://localhost:8080/swagger-ui.html
#
# 3. Les données H2 sont PERDUES à l'arrêt de l'application
#    (c'est normal, c'est une base en mémoire)
#
# 4. Pour revenir à MySQL, commenter la section H2 et
#    décommenter la section MySQL
# ============================================

